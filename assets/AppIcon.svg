<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- VoiceLogger Mac icon. Same design is drawn in SwiftUI (AppIcon.swift) for the native app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23233a"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#10ba82"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b8ff"/>
      <stop offset="1" stop-color="#a873fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="6"/>
  <g filter="url(#glow)">
    <rect x="249" y="462" width="70" height="156" rx="35" fill="url(#bar)"/>
    <rect x="363" y="389" width="70" height="302" rx="35" fill="url(#bar)"/>
    <rect x="477" y="316" width="70" height="448" rx="35" fill="url(#bar)"/>
    <rect x="591" y="405" width="70" height="270" rx="35" fill="url(#bar)"/>
    <rect x="705" y="467" width="70" height="146" rx="35" fill="url(#bar)"/>
  </g>
  <g filter="url(#glow)">
    <path d="M735 205 Q735 300 830 300 Q735 300 735 395 Q735 300 640 300 Q735 300 735 205 Z" fill="url(#spark)"/>
    <path d="M826 370 Q826 410 866 410 Q826 410 826 450 Q826 410 786 410 Q826 410 826 370 Z" fill="url(#spark)"/>
  </g>
</svg>
